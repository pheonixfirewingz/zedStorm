[package]
name = "mermaid_render"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
merman = { version = "=0.8.0-alpha.5", default-features = false, features = [
    "layout-cytoscape",
    "svg",
] }
# Merman's prerelease facade is incompatible with the stable companion crates.
merman-core = { version = "=0.8.0-alpha.5", default-features = false }
merman-render = { version = "=0.8.0-alpha.5", default-features = false }
quick-xml = "0.41"
serde_json = "1.0"

[dev-dependencies]
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b" }
mermaid_render = { path = ".", features = ["test-support"] }
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts"] }

[package.metadata.cargo-shear]
ignored = ["merman-core", "merman-render"]
