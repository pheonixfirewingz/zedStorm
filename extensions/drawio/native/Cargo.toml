[package]
name = "zed-diagrams"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/document.rs"

[[bin]]
name = "zed-diagrams"
path = "src/launcher.rs"

[[bin]]
name = "zed-diagrams-webview"
path = "src/main.rs"
required-features = ["native-webview"]

[features]
default = ["native-webview"]
native-webview = ["dep:tao", "dep:wry", "dep:gtk", "dep:gdk", "dep:webkit2gtk", "dep:cairo-rs"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tao = { version = "0.37.1", optional = true }
wry = { version = "0.57.0", optional = true }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
webkit2gtk = { version = "2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

