name: Package Browser Extension

on:
  push:
    branches: [custom]
    paths:
      - 'assets/browser-extension/**'
      - '.github/workflows/browser-extension.yml'
  pull_request:
    branches: [custom]
    paths:
      - 'assets/browser-extension/**'
      - '.github/workflows/browser-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate extension files
        run: |
          jq . assets/browser-extension/manifest.json > /dev/null
          test -f assets/browser-extension/manifest.json
          test -f assets/browser-extension/background.js
          test -f assets/browser-extension/popup.html
          test -f assets/browser-extension/popup.js

      - name: Pack extension into zip archive
        run: |
          mkdir -p dist
          (cd assets/browser-extension && zip -r ../../dist/zedstorm-browser-extension.zip .)
          unzip -l dist/zedstorm-browser-extension.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zedstorm-browser-extension
          path: dist/zedstorm-browser-extension.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish browser extension release
    needs: package
    if: (github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download extension archive
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --name zedstorm-browser-extension --dir dist
          test -s dist/zedstorm-browser-extension.zip

      - name: Upload to latest-extensions-build release
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG_NAME: latest-extensions-build
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG_NAME\") | .id" || true)
          tag_reference=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG_NAME" --jq ".[] | select(.ref == \"refs/tags/$TAG_NAME\") | .ref" || true)
          if [ -n "$tag_reference" ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT"
          fi

          notes="Latest extensions build from the custom branch. Commit: $BUILD_COMMIT. Build: $RUN_URL"
          if [ -n "$release_id" ]; then
            gh release upload "$TAG_NAME" dist/zedstorm-browser-extension.zip --clobber
            gh release edit "$TAG_NAME" --title 'Latest Extensions Build' --notes "$notes"
          else
            gh release create "$TAG_NAME" dist/zedstorm-browser-extension.zip \
              --verify-tag --title 'Latest Extensions Build' --notes "$notes"
          fi
