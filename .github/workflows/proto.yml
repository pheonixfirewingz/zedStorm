name: Build Protocol Buffers Extension

on:
  push:
    branches: [custom]
    paths:
      - 'extensions/proto/**'
      - '.github/workflows/proto.yml'
  pull_request:
    branches: [custom]
    paths:
      - 'extensions/proto/**'
      - '.github/workflows/proto.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build:
    name: ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install WASM target
        run: rustup target add wasm32-wasip2

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'extensions/proto/Cargo.lock') }}
          restore-keys: |
            cargo-proto-${{ runner.os }}-${{ runner.arch }}-

      - name: Build WASM extension
        run: |
          cargo build --release --target wasm32-wasip2 --manifest-path extensions/proto/Cargo.toml

      - name: Package Linux extension
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/proto-package"
          cp "extensions/proto/target/wasm32-wasip2/release/zed_proto.wasm" "dist/proto-package/extension.wasm"
          cp "extensions/proto/extension.toml" "dist/proto-package/extension.toml"
          if [ -d "extensions/proto/languages" ]; then
            cp -r "extensions/proto/languages" "dist/proto-package/"
          fi
          tar -czf "dist/proto.tar.gz" -C "dist/proto-package" .
          tar -czf "dist/proto-linux-x86_64.tar.gz" -C "dist/proto-package" .

      - name: Package Windows extension
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgDir = "dist/proto-windows-package"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item "extensions/proto/target/wasm32-wasip2/release/zed_proto.wasm" -Destination "$pkgDir/extension.wasm"
          Copy-Item "extensions/proto/extension.toml" -Destination "$pkgDir/extension.toml"
          if (Test-Path "extensions/proto/languages") {
            Copy-Item -Recurse "extensions/proto/languages" -Destination "$pkgDir/"
          }
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/proto-windows-x86_64.zip" -Force

      - name: Upload build archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proto-${{ matrix.platform }}-x86_64
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Protocol Buffers extension release
    needs: build
    if: (github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build archives
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist-linux dist-windows release-assets
          gh run download "$RUN_ID" --name proto-linux-x86_64 --dir dist-linux
          gh run download "$RUN_ID" --name proto-windows-x86_64 --dir dist-windows
          cp -r dist-linux/* release-assets/ 2>/dev/null || true
          cp -r dist-windows/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Replace latest-extensions-build release downloads
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG_NAME: latest-extensions-build
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type d ! -name release-assets -exec rm -rf {} + 2>/dev/null || true

          LOCK_REF="refs/locks/latest-extensions-build"
          cleanup_lock() {
            gh api --method DELETE "repos/$GH_REPO/git/$LOCK_REF" 2>/dev/null || true
          }
          trap cleanup_lock EXIT

          echo "Acquiring lock for latest-extensions-build release deployment..."
          waited=0
          max_wait=600
          while ! gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$LOCK_REF" -f sha="$BUILD_COMMIT" 2>/dev/null; do
            echo "Lock is held by another deployment. Waiting 10s... (${waited}s / ${max_wait}s)"
            sleep 10
            waited=$((waited + 10))
            if [ $waited -ge $max_wait ]; then
              echo "Timed out waiting for lock. Breaking stale lock..."
              gh api --method DELETE "repos/$GH_REPO/git/$LOCK_REF" 2>/dev/null || true
              sleep 2
            fi
          done
          echo "Lock acquired successfully."

          release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" --jq .id 2>/dev/null || true)
          tag_reference=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq .ref 2>/dev/null || true)
          if [ -n "$tag_reference" ]; then
            for i in {1..3}; do
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT" -F force=true && break || sleep 2
            done
          else
            for i in {1..3}; do
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT" && break || sleep 2
            done
          fi

          notes="Latest extensions build from the custom branch. Commit: $BUILD_COMMIT. Build: $RUN_URL"
          if [ -n "$release_id" ]; then
            for i in {1..3}; do
              gh release upload "$TAG_NAME" release-assets/* --clobber && break || sleep 3
            done
            for i in {1..3}; do
              gh release edit "$TAG_NAME" --title 'Latest Extensions Build' --notes "$notes" && break || sleep 2
            done
          else
            for i in {1..3}; do
              gh release create "$TAG_NAME" release-assets/* \
                --verify-tag --title 'Latest Extensions Build' --notes "$notes" && break || sleep 3
            done
          fi
