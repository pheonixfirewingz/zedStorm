name: Build ZedStorm

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build:
    if: github.ref == 'refs/heads/custom' || (github.event_name == 'pull_request' && github.base_ref == 'custom')
    name: ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Linux packaging manifest
        if: runner.os == 'Linux'
        run: |
          test -f packaging/flatpak/dev.zedstorm.ZedStorm.yml

      - name: Install Flatpak build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate third-party licences
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-about --version 0.8.2 --locked
          ./script/generate-licenses

      - name: Build Linux Flatpak
        if: runner.os == 'Linux'
        run: ./script/build-flatpak

      - name: Build Windows editor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $visualStudio = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ tools were not found' }
          & "$visualStudio\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          cargo test --locked --package context_mcp
          cargo build --release --locked --package zed --bin zed
          & ./script/test-context-mcp.ps1 -Executable ./target/release/zed.exe

      - name: Package Windows editor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/zedstorm-windows-x86_64 -Force
          Copy-Item target/release/zed.exe, target/release/conpty.dll, target/release/OpenConsole.exe -Destination dist/zedstorm-windows-x86_64
          Copy-Item LICENSE-GPL, LICENSE-APACHE, assets/licenses.md -Destination dist/zedstorm-windows-x86_64
          Compress-Archive -Path dist/zedstorm-windows-x86_64 -DestinationPath dist/zedstorm-windows-x86_64.zip

      - name: Upload build archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zedstorm-${{ matrix.platform }}-x86_64
          path: |
            dist/*.flatpak
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish latest downloads
    needs: build
    if: github.ref == 'refs/heads/custom' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build archives
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name zedstorm-linux-x86_64 --dir dist
          gh run download "$RUN_ID" --name zedstorm-windows-x86_64 --dir dist
          test -s dist/zedstorm-linux-x86_64.flatpak
          test -s dist/zedstorm-windows-x86_64.zip

      - name: Replace latest release downloads
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == "latest") | .id')
          tag_reference=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [ -n "$tag_reference" ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$BUILD_COMMIT" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$BUILD_COMMIT"
          fi

          notes="Latest successful build from the custom branch. Commit: $BUILD_COMMIT. Build: $RUN_URL"
          if [ -n "$release_id" ]; then
            gh release upload latest dist/zedstorm-linux-x86_64.flatpak dist/zedstorm-windows-x86_64.zip --clobber
            gh release edit latest --title 'Latest ZedStorm build' --notes "$notes" --latest
          else
            gh release create latest dist/zedstorm-linux-x86_64.flatpak dist/zedstorm-windows-x86_64.zip \
              --verify-tag --title 'Latest ZedStorm build' --notes "$notes" --latest
          fi
