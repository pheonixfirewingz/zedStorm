name: Build Mermaid Extension

on:
  push:
    branches: [custom]
    paths:
      - 'extensions/mermaid/**'
      - '.github/workflows/mermaid.yml'
  pull_request:
    branches: [custom]
    paths:
      - 'extensions/mermaid/**'
      - '.github/workflows/mermaid.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build:
    name: ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install WASM target
        run: rustup target add wasm32-wasip2

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-mermaid-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'extensions/mermaid/Cargo.lock') }}
          restore-keys: |
            cargo-mermaid-${{ runner.os }}-${{ runner.arch }}-

      - name: Build WASM extension
        run: |
          cargo build --release --target wasm32-wasip2 --manifest-path extensions/mermaid/Cargo.toml

      - name: Package Linux extension
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/mermaid-package"
          cp "extensions/mermaid/target/wasm32-wasip2/release/zed_mermaid.wasm" "dist/mermaid-package/extension.wasm"
          cp "extensions/mermaid/extension.toml" "dist/mermaid-package/extension.toml"
          if [ -d "extensions/mermaid/languages" ]; then
            cp -r "extensions/mermaid/languages" "dist/mermaid-package/"
          fi
          tar -czf "dist/mermaid.tar.gz" -C "dist/mermaid-package" .
          tar -czf "dist/mermaid-linux-x86_64.tar.gz" -C "dist/mermaid-package" .

      - name: Package Windows extension
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgDir = "dist/mermaid-windows-package"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item "extensions/mermaid/target/wasm32-wasip2/release/zed_mermaid.wasm" -Destination "$pkgDir/extension.wasm"
          Copy-Item "extensions/mermaid/extension.toml" -Destination "$pkgDir/extension.toml"
          if (Test-Path "extensions/mermaid/languages") {
            Copy-Item -Recurse "extensions/mermaid/languages" -Destination "$pkgDir/"
          }
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/mermaid-windows-x86_64.zip" -Force

      - name: Upload build archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-${{ matrix.platform }}-x86_64
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Mermaid extension release
    needs: build
    if: (github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build archives
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist-linux dist-windows release-assets
          gh run download "$RUN_ID" --name mermaid-linux-x86_64 --dir dist-linux
          gh run download "$RUN_ID" --name mermaid-windows-x86_64 --dir dist-windows
          cp -r dist-linux/* release-assets/ 2>/dev/null || true
          cp -r dist-windows/* release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Replace latest-extensions-build release downloads
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG_NAME: latest-extensions-build
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == "$TAG_NAME") | .id" || true)
          tag_reference=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG_NAME" --jq ".[] | select(.ref == "refs/tags/$TAG_NAME") | .ref" || true)
          if [ -n "$tag_reference" ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG_NAME" -f sha="$BUILD_COMMIT"
          fi

          notes="Latest extensions build from the custom branch. Commit: $BUILD_COMMIT. Build: $RUN_URL"
          if [ -n "$release_id" ]; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
            gh release edit "$TAG_NAME" --title 'Latest Extensions Build' --notes "$notes"
          else
            gh release create "$TAG_NAME" release-assets/*               --verify-tag --title 'Latest Extensions Build' --notes "$notes"
          fi
