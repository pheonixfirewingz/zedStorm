[package]
name = "project_benchmarks"
version = "0.1.0"
publish.workspace = true
edition.workspace = true

[features]
bench-support = ["gpui/bench-support", "gpui_platform/bench-support", "project/bench-support", "worktree/bench-support"]
test-support = ["http_client/test-support"]

[[bin]]
name = "project_benchmarks"
path = "src/main.rs"
required-features = ["test-support"]

[[bench]]
name = "search_budget"
path = "benches/search_budget.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "remote_snapshot"
path = "benches/remote_snapshot.rs"
harness = false
required-features = ["bench-support"]

[dependencies]
worktree.workspace = true
criterion.workspace = true
anyhow.workspace = true
askpass.workspace = true
clap.workspace = true
client.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
http_client.workspace = true
language.workspace = true
node_runtime.workspace = true
project.workspace = true
release_channel.workspace = true
remote = { workspace = true, features = ["build-remote-server-binary"] }
rpassword = "7.4"
semver.workspace = true
settings.workspace = true
watch.workspace = true

[lints]
workspace = true
