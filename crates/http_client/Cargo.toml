[package]
name = "http_client"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[lints]
workspace = true

[features]
test-support = []
github-download = [
    "dep:async-compression",
    "dep:async-fs",
    "dep:async-tar",
    "dep:paths",
    "dep:sha2",
    "dep:sevenz-rust2",
    "dep:smol",
    "dep:tempfile",
    "dep:util",
    "dep:which",
]

[lib]
path = "src/http_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_urlencoded.workspace = true
url.workspace = true

log.workspace = true
async-compression = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
util = { workspace = true, optional = true }
async-fs = { workspace = true, optional = true }
async-tar = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sevenz-rust2 = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
which = { workspace = true, optional = true }
