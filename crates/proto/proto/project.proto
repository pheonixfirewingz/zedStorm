syntax = "proto3";
package zed.messages;

import "buffer.proto";
import "core.proto";
import "git.proto";
import "worktree.proto";

message UpdateProject {
  uint64 project_id = 1;
  repeated WorktreeMetadata worktrees = 2;
}

message UpdateWorktree {
  uint64 project_id = 1;
  uint64 worktree_id = 2;
  string root_name = 3;
  repeated Entry updated_entries = 4;
  repeated uint64 removed_entries = 5;
  repeated RepositoryEntry updated_repositories = 6; // deprecated
  repeated uint64 removed_repositories = 7; // deprecated
  uint64 scan_id = 8;
  bool is_last_update = 9;
  string abs_path = 10;
  optional string root_repo_common_dir = 11;
  bool root_repo_is_linked_worktree = 12;
}

message RepositoryEntry {
  uint64 repository_id = 1;
  reserved 2;
  repeated StatusEntry updated_statuses = 3;
  repeated string removed_statuses = 4;
  repeated string current_merge_conflicts = 5;
  optional Branch branch_summary = 6;
}

message GetUsers {
  repeated uint64 user_ids = 1;
}

message FuzzySearchUsers {
  string query = 1;
}

message UsersResponse {
  repeated User users = 1;
}

message ViewId {
  PeerId creator = 1;
  uint64 id = 2;
}

message UpdateActiveView {
  reserved 1, 2;
  View view = 3;
}

enum PanelId {
  AssistantPanel = 0;
  DebugPanel = 1;
}

message UpdateView {
  ViewId id = 1;
  optional PeerId leader_id = 2;

  oneof variant {
    Editor editor = 3;
  }

  message Editor {
    repeated ExcerptInsertion inserted_excerpts = 1;
    repeated uint64 deleted_excerpts = 2;
    repeated Selection selections = 3;
    optional Selection pending_selection = 4;
    EditorAnchor scroll_top_anchor = 5;
    reserved 6;
    reserved 7;
    double scroll_x = 8;
    double scroll_y = 9;
    repeated PathExcerpts updated_paths = 10;
    repeated uint64 deleted_buffers = 11;
  }
}

message View {
  ViewId id = 1;
  optional PeerId leader_id = 2;
  optional PanelId panel_id = 6;

  oneof variant {
    Editor editor = 3;
  }

  reserved 4, 5;
  reserved "channel_view";

  message Editor {
    bool singleton = 1;
    optional string title = 2;
    repeated Excerpt excerpts = 3;
    repeated Selection selections = 4;
    optional Selection pending_selection = 5;
    EditorAnchor scroll_top_anchor = 6;
    reserved 7;
    reserved 8;
    double scroll_x = 9;
    double scroll_y = 10;
    repeated PathExcerpts path_excerpts = 11;
  }

}

message ExcerptInsertion {
  Excerpt excerpt = 1;
  optional uint64 previous_excerpt_id = 2;
}

message Excerpt {
  uint64 id = 1;
  uint64 buffer_id = 2;
  Anchor context_start = 3;
  Anchor context_end = 4;
  Anchor primary_start = 5;
  Anchor primary_end = 6;
}

message ExcerptRange {
  Anchor context_start = 1;
  Anchor context_end = 2;
  Anchor primary_start = 3;
  Anchor primary_end = 4;
}

message PathExcerpts {
  PathKey path_key = 1;
  uint64 buffer_id = 2;
  repeated ExcerptRange ranges = 3;
}
