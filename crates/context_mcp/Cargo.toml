[package]
name = "context_mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "src/context_mcp.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
ignore.workspace = true
paths.workspace = true
