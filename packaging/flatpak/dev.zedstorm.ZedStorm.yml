app-id: dev.zedstorm.ZedStorm
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zedstorm
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
modules:
  - name: zedstorm
    buildsystem: simple
    build-commands:
      - install -Dm755 zed /app/bin/zedstorm
      - install -Dm644 dev.zedstorm.ZedStorm.desktop /app/share/applications/dev.zedstorm.ZedStorm.desktop
      - install -Dm644 app-icon.png /app/share/icons/hicolor/512x512/apps/dev.zedstorm.ZedStorm.png
      - install -Dm644 LICENSE-GPL /app/share/licenses/dev.zedstorm.ZedStorm/LICENSE-GPL
      - install -Dm644 LICENSE-APACHE /app/share/licenses/dev.zedstorm.ZedStorm/LICENSE-APACHE
      - install -Dm644 licenses.md /app/share/licenses/dev.zedstorm.ZedStorm/third-party.md
    sources:
      - type: file
        path: ../../target/release/zed
      - type: file
        path: ../../crates/zed/resources/app-icon.png
      - type: file
        path: ../../LICENSE-GPL
      - type: file
        path: ../../LICENSE-APACHE
      - type: file
        path: ../../assets/licenses.md
      - type: inline
        dest-filename: dev.zedstorm.ZedStorm.desktop
        contents: |
          [Desktop Entry]
          Type=Application
          Name=ZedStorm
          GenericName=Text Editor
          Exec=zedstorm %F
          Icon=dev.zedstorm.ZedStorm
          Terminal=false
          Categories=Utility;TextEditor;Development;IDE;
          MimeType=text/plain;inode/directory;
