id: dev.zedstorm.ZedStorm
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: zedstorm
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: zedstorm
    buildsystem: simple
    build-commands:
      - install -Dm755 zed /app/bin/zedstorm
      - install -Dm755 codex /app/bin/codex
      - install -Dm644 dev.zedstorm.ZedStorm.desktop /app/share/applications/dev.zedstorm.ZedStorm.desktop
      - install -Dm644 dev.zedstorm.ZedStorm.metainfo.xml /app/share/metainfo/dev.zedstorm.ZedStorm.metainfo.xml
      - install -Dm644 app-icon.png /app/share/icons/hicolor/512x512/apps/dev.zedstorm.ZedStorm.png
      - install -Dm644 LICENSE-GPL /app/share/licenses/zedstorm/LICENSE-GPL
      - install -Dm644 LICENSE-APACHE /app/share/licenses/zedstorm/LICENSE-APACHE
      - install -Dm644 licenses.md /app/share/licenses/zedstorm/third-party.md
    sources:
      - type: file
        path: ../../target/release/zed
      - type: script
        dest-filename: codex
        commands:
          - exec flatpak-spawn --host --directory="$PWD" "${SHELL:-/bin/sh}" -lc 'exec codex "$@"' codex "$@"
      - type: file
        path: dev.zedstorm.ZedStorm.desktop
      - type: file
        path: dev.zedstorm.ZedStorm.metainfo.xml
      - type: file
        path: ../../crates/zed/resources/app-icon.png
      - type: file
        path: ../../LICENSE-GPL
      - type: file
        path: ../../LICENSE-APACHE
      - type: file
        path: ../../assets/licenses.md
